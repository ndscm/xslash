[package]
name = "xslash"
version = "0.0.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
clap.workspace = true
filetime.workspace = true
flate2.workspace = true
libc.workspace = true
lzma-rs.workspace = true
ruzstd.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
ureq.workspace = true
zip.workspace = true

[build-dependencies]
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true

[workspace]
resolver = "3"
members = [
    ".",
]

[workspace.dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
filetime = "0.2.29"
flate2 = "1.1.10"
libc = "0.2.191"
lzma-rs = "0.3.0"
rustix = { version = "1.1.5", features = ["process"] }
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
ureq = "3.5.0"
zip = { version = "9.0.5", features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
